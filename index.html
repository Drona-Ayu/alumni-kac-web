<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>KhAyAL — Kannur Ayurveda College Alumni Association</title>
    <meta
      name="description"
      content="The alumni association of Government Ayurveda Medical College, Pariyaram — connecting graduates across batches for academic exchange, mentorship and service."
    />
    <meta name="theme-color" content="#fbf8f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="KhAyAL — Kannur Ayurveda College Alumni Association" />
    <meta
      property="og:description"
      content="The alumni association of Government Ayurveda Medical College, Pariyaram."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      /* Applied before first paint so a chosen theme never flashes the other
         one on load. Kept inline and tiny for exactly that reason. */
      try {
        var t = localStorage.getItem('khayal:theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
