name: Checks

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # CI installs its own matching browser. The PLAYWRIGHT_CHROMIUM_PATH
      # override in playwright.config.ts exists only for sandboxes that cannot
      # run this, and is deliberately unset here.
      - run: npx playwright install --with-deps chromium

      # The config's webServer builds the site and serves the production output,
      # so these run against what actually ships.
      - run: npm test

      # Only on failure: a red run should be diagnosable without anyone
      # downloading traces from the green ones.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
